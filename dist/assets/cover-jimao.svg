<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">几猫国产3A大作原创海报</title>
  <desc id="desc">雨夜港区、橙色信号灯、集装箱与几猫队徽构成的竖版游戏海报</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172a"/>
      <stop offset="0.48" stop-color="#17273a"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="36%" r="52%">
      <stop offset="0" stop-color="#ffb45c" stop-opacity=".95"/>
      <stop offset=".26" stop-color="#ff8a32" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff8a32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="container" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#344451"/>
      <stop offset="1" stop-color="#111a22"/>
    </linearGradient>
    <pattern id="rain" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="2" y1="0" x2="2" y2="18" stroke="#c9e2ff" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
